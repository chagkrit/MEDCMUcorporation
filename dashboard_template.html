<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDCMU Social Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232a78d6%27/%3E%3Cpath d=%27M7 22V10l9 8 9-8v12%27 stroke=%27white%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f3f2ef; --surface:#fcfcfb; --surface-2:#f7f6f3; --border:#dcdbd6; --grid:#e6e5e1;
  --text-1:#0b0b0b; --text-2:#52514e; --text-3:#6f6e68;
  --b-MEDCMU:#2a78d6; --b-SI:#eb6834; --b-CU:#1baf7a; --b-SMV:#eda100;
  --pos:#2a78d6; --neu:#b9b8b2; --neg:#e34948;
  --side:#ffffff; --accent-2:#6a4ce0; --accent:#2a78d6; --warn-bg:#fdf3dc; --warn-text:#6b4a00;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0b1017; --side:#0f1520; --surface:#141a24; --surface-2:#1a2230; --border:#243044; --grid:#212b3b;
    --text-1:#f4f6fa; --text-2:#aab4c5; --text-3:#7d8899;
    --b-MEDCMU:#3987e5; --b-SI:#d95926; --b-CU:#199e70; --b-SMV:#c98500;
    --pos:#3987e5; --neu:#6b6a65; --neg:#e66767;
    --accent:#4f8cff; --accent-2:#7a5cff; --warn-bg:#2b2410; --warn-text:#f1d58a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b1017; --side:#0f1520; --surface:#141a24; --surface-2:#1a2230; --border:#243044; --grid:#212b3b;
    --text-1:#f4f6fa; --text-2:#aab4c5; --text-3:#7d8899;
    --b-MEDCMU:#3987e5; --b-SI:#d95926; --b-CU:#199e70; --b-SMV:#c98500;
    --pos:#3987e5; --neu:#6b6a65; --neg:#e66767;
    --accent:#4f8cff; --accent-2:#7a5cff; --warn-bg:#2b2410; --warn-text:#f1d58a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--text-1);
  font-family:"Noto Sans Thai","Sukhumvit Set","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55}
.sub{color:var(--text-2);font-size:13px;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.btn{font:inherit;font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--text-3)}
section.panel{padding-top:8px}
.controls{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin:0 0 14px}
.ctl{display:flex;align-items:center;flex-wrap:wrap;max-width:100%;gap:8px;font-size:13px;color:var(--text-2)}
.seg{max-width:100%;overflow-x:auto;display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;color:var(--text-2);background:transparent;border:0;padding:5px 11px;cursor:pointer;
  border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
select{font:inherit;font-size:13px;color:var(--text-1);background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:5px 8px}
label.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
label.tog input{accent-color:var(--accent)}
label.tog i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g1{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:0}
.card h3{margin:0;font-size:15px;font-weight:600}
.card .sub{margin:2px 0 8px}
.card figcaption{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tbtn{font:inherit;font-size:12px;color:var(--text-2);background:transparent;border:1px solid var(--border);
  border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.cv{position:relative;height:300px}
.cv.tall{height:360px}
.kpi{border-top:4px solid var(--kc);padding-top:12px}
.kpi .name{font-size:13px;color:var(--text-2);font-weight:600}
.kpi .big{font-size:26px;font-weight:700;line-height:1.2;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.kpi dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;color:var(--text-2)}
.kpi dd{margin:0;text-align:right;color:var(--text-1);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;margin:0 0 14px}
.note.warn{background:var(--warn-bg);color:var(--warn-text);border-color:transparent}
.note b{color:inherit}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
th{color:var(--text-2);font-weight:600;font-size:12px;background:var(--surface-2);position:sticky;top:0}
td.na{color:var(--text-3);font-size:12px}
td.best{font-weight:700}
.bdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline;background:var(--kc)}
.tv{margin-top:8px}
.tv[hidden]{display:none}
a{color:var(--accent)}
.ptxt{max-width:520px;white-space:normal;text-align:left}
h2{font-size:17px;margin:22px 0 8px}
ul.clean{margin:6px 0 0;padding-left:18px;color:var(--text-2);font-size:13.5px}
ul.clean li{margin:3px 0}
footer{color:var(--text-3);font-size:12px;margin-top:26px}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--border);
  padding:22px 14px 16px;display:flex;flex-direction:column;gap:6px}
.logo{padding:0 8px 14px}
.logo-t{font-size:21px;font-weight:700;letter-spacing:.3px}
.logo-s{font-size:10.5px;letter-spacing:1.4px;color:var(--text-3);margin-top:3px}
.nav-h{font-size:11.5px;color:var(--text-3);letter-spacing:.6px;padding:14px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;font:inherit;font-size:14px;font-weight:500;color:var(--text-2);
  background:transparent;border:1px solid transparent;border-radius:11px;padding:9px 10px;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text-1)}
.nav-item[aria-current="page"]{color:var(--text-1);border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav-item svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item .mono{width:19px;height:19px;flex:0 0 19px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
  font-size:9.5px;font-weight:700;display:grid;place-items:center;color:var(--text-2)}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .badge{font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:0 8px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.legend span{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-2)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:12px;color:var(--text-2);line-height:1.5}
.side-foot b{color:var(--text-1);display:block;font-size:12.5px}
.main{min-width:0;padding:0 30px 48px}
header.top{padding:26px 0 14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;
  border-bottom:1px solid var(--border);margin-bottom:18px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:.1px}
.hright{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn.primary{color:#fff;border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));padding:9px 16px;border-radius:10px;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.kpi2{display:flex;gap:14px;align-items:center;padding:16px}
.kpi2 .ico{width:48px;height:48px;flex:0 0 48px;border-radius:13px;display:grid;place-items:center;color:var(--kc);
  background:color-mix(in srgb,var(--kc) 17%,transparent)}
.kpi2 .ico svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi2 .kl{font-size:12.5px;color:var(--text-2)}
.kpi2 .kv{font-size:27px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi2 .kcap{font-size:12px;color:var(--text-3);margin-top:1px}
.hnote{font-size:12.5px;color:var(--text-3);margin:8px 2px 16px}
.card{border-radius:14px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static;height:auto;flex-direction:column;padding:14px 12px 8px;border-right:0;border-bottom:1px solid var(--border)}
  #nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
  .nav-group{display:contents}.nav-h{display:none}
  .nav-item{width:auto;flex:0 0 auto;white-space:nowrap}
  .side-foot{display:none}
  .main{padding:0 14px 40px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><div class="logo-t">MedCMU</div><div class="logo-s">SOCIAL ANALYTICS · 4-BRAND BENCHMARK</div></div>
    <nav id="nav" aria-label="เมนูหลัก"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pgTitle"></h1><p class="sub" id="pgSub"></p></div>
      <div class="hright"><div class="chips" id="brandChips" aria-label="สีประจำแบรนด์"></div>
      <button class="btn primary" id="themeBtn" type="button">สลับโหมดสว่าง/มืด</button></div>
    </header>
    <div id="panels"></div>
    <footer id="foot"></footer>
  </main>
</div>

<script>/*__CHARTJS__*/</script>
<script>
const D = /*__DATA__*/null;
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const PL = {facebook:"Facebook", instagram:"Instagram", tiktok:"TikTok", youtube:"YouTube", twitter:"X / Twitter"};
const SC = {owned:"Owned (บัญชีทางการ)", earned:"Earned (ถูกกล่าวถึง)"};
const BR = D.brands, BK = BR.map(b => b.key);
const bname = k => BR.find(b => b.key === k).short;
const cell = (b, p, s) => D.cells[`${b}|${p}|${s}`] || null;
const NA = "ข้อมูลไม่เพียงพอ";
const nf = new Intl.NumberFormat("th-TH");
const fmt = v => v == null ? NA : nf.format(Math.round(v));
const fmt1 = v => v == null ? NA : new Intl.NumberFormat("th-TH", {maximumFractionDigits:1}).format(v);
const fpct = (v, d = 1) => v == null ? NA : new Intl.NumberFormat("th-TH", {maximumFractionDigits:d, minimumFractionDigits:d}).format(v) + "%";
const abbr = v => { const a = Math.abs(v); return a >= 1e6 ? (v/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,"")+"M" : a >= 1e3 ? (v/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,"")+"k" : String(Math.round(v)); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const bcol = k => cv("--b-" + k);
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const dlabel = d => new Date(d + "T00:00:00Z").toLocaleDateString("th-TH", {day:"numeric", month:"short", timeZone:"UTC"});
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

function seg(id, opts, val){
  return `<div class="seg" id="${id}" role="group">${opts.map(o => `<button type="button" data-v="${esc(o.v)}" class="${o.v === val ? "on" : ""}" aria-pressed="${o.v === val}">${esc(o.t)}</button>`).join("")}</div>`;
}
function bindSeg(id, cb){ const h = $("#" + id); h && h.querySelectorAll("button").forEach(b => b.onclick = () => cb(b.dataset.v)); }
function sel(id, opts, val){
  return `<select id="${id}">${opts.map(o => `<option value="${esc(o.v)}" ${o.v === val ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select>`;
}
function bindSel(id, cb){ const h = $("#" + id); h && (h.onchange = () => cb(h.value)); }
const platOpts = (all) => (all ? [{v:"all", t:"ทุกแพลตฟอร์ม"}] : []).concat(D.platforms.map(p => ({v:p, t:PL[p]})));

/* ---------- charts ---------- */
const charts = {}, tableOpen = new Set();
function deepMerge(a, b){ for (const k in b){ if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) { a[k] = deepMerge(a[k] && typeof a[k] === "object" ? a[k] : {}, b[k]); } else a[k] = b[k]; } return a; }

const valueLabels = {
  id:"vl",
  afterDatasetsDraw(chart){
    const o = chart.options.plugins.vl; if (!o || !o.on) return;
    const ctx = chart.ctx, horiz = chart.options.indexAxis === "y";
    ctx.save(); ctx.font = "600 11.5px " + getComputedStyle(document.body).fontFamily; ctx.fillStyle = cv("--text-1");
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di); if (meta.hidden) return;
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v == null){
          ctx.fillStyle = cv("--text-3"); ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          const x = el.x, y = (chart.scales.y ? chart.scales.y.getPixelForValue(0) : el.y) - 4;
          if (!horiz) ctx.fillText(NA, x, y);
          ctx.fillStyle = cv("--text-1"); ctx.font = "600 11.5px " + getComputedStyle(document.body).fontFamily;
          return;
        }
        const t = chart.$vlfmt ? chart.$vlfmt(v) : String(v);
        if (horiz){ ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(t, el.x + 6, el.y); }
        else { ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.fillText(t, el.x, el.y - 4); }
      });
    });
    ctx.restore();
  }
};
const crosshair = {
  id:"cross",
  afterDatasetsDraw(chart){
    if (chart.config.type !== "line") return;
    const a = chart.tooltip && chart.tooltip._active; if (!a || !a.length) return;
    const x = a[0].element.x, ca = chart.chartArea, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = cv("--text-3"); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, ca.top); ctx.lineTo(x, ca.bottom); ctx.stroke(); ctx.restore();
  }
};
const endLabels = {
  id:"endl",
  afterDatasetsDraw(chart){
    if (!chart.options.plugins.endl || !chart.options.plugins.endl.on) return;
    const ctx = chart.ctx, pts = [];
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di); if (meta.hidden) return;
      let li = -1; for (let i = ds.data.length - 1; i >= 0; i--) if (ds.data[i] != null){ li = i; break; }
      if (li >= 0) pts.push({y:meta.data[li].y, x:meta.data[li].x, t:ds.label});
    });
    pts.sort((a, b) => a.y - b.y);
    for (let i = 1; i < pts.length; i++) if (pts[i].y - pts[i-1].y < 14) pts[i].y = pts[i-1].y + 14;
    ctx.save(); ctx.font = "600 12px " + getComputedStyle(document.body).fontFamily; ctx.fillStyle = cv("--text-1");
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    pts.forEach(p => ctx.fillText(p.t, p.x + 9, p.y));
    ctx.restore();
  }
};

function baseOpts(type){
  const grid = cv("--grid"), t2 = cv("--text-2");
  const o = {
    responsive:true, maintainAspectRatio:false, animation:false,
    layout:{padding:{top:18, right:4}},
    plugins:{
      legend:{position:"bottom", labels:{color:t2, usePointStyle:true, pointStyle:"rectRounded", boxWidth:9, boxHeight:9, font:{size:12}}},
      tooltip:{backgroundColor:cv("--surface-2"), titleColor:cv("--text-1"), bodyColor:cv("--text-1"), borderColor:cv("--border"), borderWidth:1,
               padding:10, boxPadding:4, usePointStyle:true,
               callbacks:{label: c => ` ${c.dataset.label ? c.dataset.label + ": " : ""}${c.parsed.y == null && c.parsed.x != null ? fmt(c.parsed.x) : (c.parsed.y == null ? NA : fmt1(c.parsed.y))}`}},
      vl:{on:false}, endl:{on:false}
    },
    scales:{
      x:{grid:{display:false}, border:{color:grid}, ticks:{color:t2, font:{size:12}, maxRotation:0, autoSkip:true}},
      y:{beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{color:t2, font:{size:12}, callback:v => abbr(v)}}
    },
    interaction:{mode:"nearest", intersect:true}
  };
  if (type === "line") o.interaction = {mode:"index", intersect:false};
  return o;
}
function mk(id, type, data, opts = {}, tfmt){
  if (charts[id]) charts[id].destroy();
  const el = document.getElementById(id); if (!el) return;
  // Chart.js treats any function-valued option as scriptable (calls it with a context object),
  // so keep the value-label formatter out of the options tree.
  const vlfmt = opts.plugins && opts.plugins.vl ? opts.plugins.vl.fmt : null;
  if (vlfmt) delete opts.plugins.vl.fmt;
  const cfg = {type, data, options:deepMerge(baseOpts(type), opts), plugins:[valueLabels, crosshair, endLabels]};
  const ch = new Chart(el, cfg); ch.$tfmt = tfmt || fmt1; ch.$vlfmt = vlfmt; charts[id] = ch;
  fillTable(id);
  return ch;
}
function destroyAll(){ Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function fillTable(id){
  const host = document.getElementById(id + "-t"); if (!host) return;
  const ch = charts[id], labels = ch.data.labels, ds = ch.data.datasets;
  let h = `<div class="tw"><table><thead><tr><th></th>${ds.map(d => `<th>${esc(d.label || "ค่า")}</th>`).join("")}</tr></thead><tbody>`;
  labels.forEach((l, i) => { h += `<tr><td>${esc(l)}</td>${ds.map(d => { const v = d.data[i]; return v == null ? `<td class="na">${NA}</td>` : `<td>${ch.$tfmt(v)}</td>`; }).join("")}</tr>`; });
  host.innerHTML = h + "</tbody></table></div>";
  host.hidden = !tableOpen.has(id);
}
function card(id, title, sub, tall){
  return `<figure class="card"><figcaption><div><h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}</div>
  <button class="tbtn" type="button" data-t="${id}" aria-expanded="${tableOpen.has(id)}">ตาราง</button></figcaption>
  <div class="cv ${tall ? "tall" : ""}"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div><div class="tv" id="${id}-t" hidden></div></figure>`;
}
function bindTables(root){
  root.querySelectorAll(".tbtn").forEach(b => b.onclick = () => {
    const id = b.dataset.t, h = document.getElementById(id + "-t");
    if (tableOpen.has(id)) tableOpen.delete(id); else tableOpen.add(id);
    h.hidden = !tableOpen.has(id); b.setAttribute("aria-expanded", tableOpen.has(id));
  });
}

/* ===== 1 overview ===== */
function headline(){
  const own = b => D.platforms.map(p => cell(b, p, "owned")).filter(Boolean);
  const eng = BK.map(b => sum(own(b).map(c => c.engagement))), rank = 1 + eng.filter(v => v > eng[0]).length;
  const cs = own("MEDCMU"), pt = sum(cs.map(c => c.posts_text)), pr = sum(cs.map(c => c.posts_raw));
  const w = cs.filter(c => c.follower_start != null), f0 = sum(w.map(c => c.follower_start)), f1 = sum(w.map(c => c.follower_end));
  const mo = D.score_months, last = mo.length - 1, bs = BK.map(b => ((D.scores[b] || {})["Brand Score"] || [])[last]), sr = 1 + bs.filter(v => v > bs[0]).length;
  const k = (ic, lab, val, cap) => `<div class="card kpi2" style="--kc:var(--b-MEDCMU)"><div class="ico">${ICON[ic]}</div><div><div class="kl">${lab}</div><div class="kv">${val}</div><div class="kcap">${cap}</div></div></div>`;
  return `<div class="grid g4">` +
    k("send", "โพสต์ที่มีข้อความ", fmt(pt), `แถวดิบ Wisesight ${fmt(pr)}`) +
    k("heart", "engagement รวม", fmt(eng[0]), `อันดับ #${rank} จาก 4 แบรนด์ · รวมข้ามแพลตฟอร์ม`) +
    k("award", `Brand Score (${mo[last]})`, fmt(bs[0]), `อันดับ #${sr} จาก 4 · คนละช่วงกับข้อมูลโพสต์`) +
    k("trend", "ผู้ติดตามที่เพิ่ม", (f1 >= f0 ? "+" : "") + fmt(f1 - f0), f0 ? `${fpct((f1 - f0) / f0 * 100)} จากต้นช่วง · ผลรวมทุกแพลตฟอร์ม` : NA) +
    `</div><p class="hnote">การ์ดด้านบน: MEDCMU · Owned · ทุกแพลตฟอร์ม</p>`;
}

    {scales:{y:{ticks:{callback:v => abbr(v)}}}}, fmt);

/* ===== 5 sentiment ===== */
function rSent(p){
  const st = S.sentiment, pls = st.plat === "all" ? D.platforms : [st.plat];
  const row = b => { const rs = D.sentiment.filter(s => s.b === b && pls.includes(s.p)); if (!rs.length) return null;
    const pos = sum(rs.map(r => r.pos)), neg = sum(rs.map(r => r.neg)), neu = sum(rs.map(r => r.neu)); return {pos, neg, neu, n:pos + neg + neu}; };
  const rs = BK.map(row);
  let h = `<div class="controls"><div class="ctl">แพลตฟอร์ม ${seg("nPlat", platOpts(true), st.plat)}</div></div>
  <p class="note">Sentiment ในชีตนี้จำนวนแถวตรงกับโพสต์ <b>Earned</b> (การพูดถึงแบรนด์) ไม่ใช่โพสต์ของบัญชีทางการ · ผลจัดโดยระบบของ Wisesight ·
  ข้อความบางแบรนด์มีจำนวนน้อยมาก (ดูคอลัมน์ n) ควรอ่านอย่างระมัดระวัง</p>
  <div class="grid g1">${card("cN", "สัดส่วน Sentiment ของโพสต์ที่กล่าวถึง (Earned)", "แท่งละ 100% · บวก / กลาง / ลบ", true)}</div>
  <h2>ตัวเลข</h2><div class="card"><div class="tw"><table id="nT"></table></div></div>`;
  p.innerHTML = h; bindTables(p); bindSeg("nPlat", v => { st.plat = v; render(); });
  const pct = (r, k) => r && r.n ? r[k] / r.n * 100 : null;
  const dsx = (label, key, col) => ({label, data:rs.map(r => pct(r, key)), backgroundColor:cv(col), borderColor:cv("--surface"), borderWidth:2, borderSkipped:false, borderRadius:3, maxBarThickness:48});
  mk("cN", "bar", {labels:BK.map((b, i) => `${bname(b)}${rs[i] ? " (n=" + fmt(rs[i].n) + ")" : ""}`), datasets:[dsx("บวก", "pos", "--pos"), dsx("กลาง", "neu", "--neu"), dsx("ลบ", "neg", "--neg")]},
    {indexAxis:"y", scales:{x:{stacked:true, max:100, ticks:{callback:v => v + "%"}, grid:{color:cv("--grid")}}, y:{stacked:true, beginAtZero:false, grid:{display:false}, ticks:{callback:function(v){ return this.getLabelForValue(v); }}}},
     plugins:{tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${fpct(c.parsed.x)}`}}}}, v => fpct(v));
  let t = `<thead><tr><th>แบรนด์</th><th>บวก</th><th>กลาง</th><th>ลบ</th><th>n</th><th>บวก %</th><th>ลบ %</th><th>Net (บวก−ลบ) %</th></tr></thead><tbody>`;
  BK.forEach((b, i) => { const r = rs[i]; t += r ? `<tr><td>${bdot(b)}${bname(b)}</td><td>${fmt(r.pos)}</td><td>${fmt(r.neu)}</td><td>${fmt(r.neg)}</td><td>${fmt(r.n)}</td><td>${fpct(pct(r, "pos"))}</td><td>${fpct(pct(r, "neg"))}</td><td>${fpct(pct(r, "pos") - pct(r, "neg"))}</td></tr>` : `<tr><td>${bname(b)}</td><td colspan="7" class="na">${NA}</td></tr>`; });
  $("#nT").innerHTML = t + "</tbody>";
}

/* ===== 6 trend ===== */
function weekly(dates, arr){
  const out = {};
  dates.forEach((d, i) => { const dt = new Date(d + "T00:00:00Z"), dow = (dt.getUTCDay() + 6) % 7; dt.setUTCDate(dt.getUTCDate() - dow); const k = dt.toISOString().slice(0, 10); (out[k] = out[k] || {s:0, n:0}); out[k].s += arr[i] || 0; out[k].n++; });
  return out;
}
function rTrend(p){
  const st = S.trend;
  let h = `<div class="controls"><div class="ctl">แพลตฟอร์ม ${sel("tPlat", platOpts(false), st.plat)}</div>
   <div class="ctl">ประเภท ${seg("tScope", [{v:"owned", t:"Owned"}, {v:"earned", t:"Earned"}], st.scope)}</div>
   <div class="ctl">ตัวชี้วัด ${seg("tMet", [{v:"eng", t:"engagement"}, {v:"posts", t:"จำนวนโพสต์ (มีข้อความ)"}], st.metric)}</div>
   <div class="ctl">ช่วง ${seg("tGran", [{v:"day", t:"รายวัน"}, {v:"week", t:"รายสัปดาห์"}], st.gran)}</div></div>
  <div class="controls">${BK.map(b => `<label class="tog"><input type="checkbox" data-b="${b}" ${st.brands.has(b) ? "checked" : ""}><i style="background:${bcol(b)}"></i>${bname(b)}</label>`).join("")}</div>
  <p class="note">${st.scope === "owned" ? "จำนวนโพสต์รายวันนับจากแถวที่มีข้อความ (ข้อมูล daily_trend ของ Owned ไม่มีจำนวนโพสต์)" : "Earned: การกล่าวถึงจากผู้อื่น"} ·
  รายสัปดาห์เริ่มวันจันทร์ สัปดาห์แรกและสัปดาห์สุดท้ายมีไม่ครบ 7 วัน</p>
  <div class="grid g1">${card("cT", "แนวโน้ม " + PL[st.plat] + " · " + (st.metric === "eng" ? "engagement" : "จำนวนโพสต์"), "", true)}</div>`;
  p.innerHTML = h; bindTables(p);
  bindSel("tPlat", v => { st.plat = v; render(); }); bindSeg("tScope", v => { st.scope = v; render(); }); bindSeg("tMet", v => { st.metric = v; render(); }); bindSeg("tGran", v => { st.gran = v; render(); });
  p.querySelectorAll("input[data-b]").forEach(i => i.onchange = () => { i.checked ? st.brands.add(i.dataset.b) : st.brands.delete(i.dataset.b); render(); });
  const use = BK.filter(b => st.brands.has(b) && D.daily[`${b}|${st.plat}|${st.scope}`]);
  let labels, sets;
  if (st.gran === "day"){ labels = D.dates.map(dlabel); sets = use.map(b => D.daily[`${b}|${st.plat}|${st.scope}`][st.metric]); }
  else { const ks = Object.keys(weekly(D.dates, D.dates.map(() => 0))).sort(); labels = ks.map(k => dlabel(k));
    sets = use.map(b => { const w = weekly(D.dates, D.daily[`${b}|${st.plat}|${st.scope}`][st.metric]); return ks.map(k => w[k].s); }); }
  const missing = BK.filter(b => st.brands.has(b) && !D.daily[`${b}|${st.plat}|${st.scope}`]);
  mk("cT", "line", {labels, datasets:use.map((b, i) => ({label:bname(b), data:sets[i], borderColor:bcol(b), backgroundColor:bcol(b), borderWidth:2,
      pointRadius:st.gran === "week" ? 4 : 0, pointHoverRadius:5, pointBorderColor:cv("--surface"), pointBorderWidth:2, tension:.2}))},
    {plugins:{legend:{display:true}}, scales:{x:{ticks:{maxTicksLimit:st.gran === "day" ? 12 : 14}}}}, fmt);
  if (missing.length) p.insertAdjacentHTML("beforeend", `<p class="note">${missing.map(bname).join(", ")}: ${NA}สำหรับตัวเลือกนี้</p>`);
}

  $("#qB").innerHTML = `<thead><tr><th>แบรนด์ | แพลตฟอร์ม | ประเภท</th><th>engagement (summary)</th><th>engagement (messages)</th><th>ต่าง</th><th>โพสต์ (summary)</th><th>แถว (messages)</th><th>ต่าง</th></tr></thead><tbody>${diffs.length ? diffs.map(r => {
    const [b, pl, s] = r.k.split("|"); return `<tr><td>${bname(b)} | ${PL[pl]} | ${s}</td><td>${fmt(r.eng_summary)}</td><td>${fmt(r.eng_msgs)}</td><td>${fmt(r.eng_msgs - r.eng_summary)}</td><td>${fmt(r.posts_summary)}</td><td>${fmt(r.rows_msgs)}</td><td>${fmt(r.rows_msgs - r.posts_summary)}</td></tr>`; }).join("") : `<tr><td colspan="7" class="na">ตรงกันทุกแถว</td></tr>`}</tbody>`;
  let c = `<thead><tr><th>แพลตฟอร์ม</th>${BK.map(b => `<th>${bdot(b)}${bname(b)}</th>`).join("")}</tr></thead><tbody>`;
  D.platforms.forEach(pl => { c += `<tr><td>${PL[pl]}</td>${BK.map(b => { const o = cell(b, pl, "owned"), e = cell(b, pl, "earned");
    return `<td class="${o && e ? "" : "na"}">${o ? "Owned ✓" : "Owned ✗"} · ${e ? "Earned ✓" : "Earned ✗"}</td>`; }).join("")}</tr>`; });
  $("#qC").innerHTML = c + "</tbody>";
}

/* ===== monthly: engagement (post export) + Brand Score (Zocial Eye) ===== */
const THM = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function moInfo(mo, days){ const [y, m] = mo.split("-").map(Number), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return {y, m, dim, full:days === dim, label:`${THM[m - 1]} ${y}` + (days < dim ? ` (${days} วัน)*` : "")}; }
function rMonthly(p){
  const st = S.monthly, M = D.monthly, pl = st.plat, sc = st.scope, perday = st.mode === "perday";
  const info = M.months.map((mo, i) => moInfo(mo, M.days[i]));
  const so = D.score_months, last = so.length - 1, MET = ["Brand Score", "Owned Score", "Earned Score", "Sentiment Score"];
  const arr = (b, m) => (D.scores[b] || {})[m] || [];
  const ev = (b, i) => { const s = M.eng[`${b}|${pl}|${sc}`]; return s ? (perday ? s[i] / M.days[i] : s[i]) : null; };
  const efmt = v => perday ? fmt1(v) : fmt(v);
  let h = `<h2 style="margin-top:0">engagement รายเดือน · ข้อมูลโพสต์ ${dlabel(D.meta.export_period[0])} – ${dlabel(D.meta.export_period[1])}</h2>
  <div class="controls"><div class="ctl">แพลตฟอร์ม ${seg("mPlat", platOpts(false), pl)}</div>
   <div class="ctl">ประเภท ${seg("mScope", [{v:"owned", t:"Owned"}, {v:"earned", t:"Earned"}], sc)}</div>
   <div class="ctl">รูปแบบ ${seg("mMode", [{v:"total", t:"รวมทั้งเดือน"}, {v:"perday", t:"เฉลี่ยต่อวัน"}], st.mode)}</div></div>
  <p class="note warn">เดือนที่มี <b>*</b> ไม่ครบเดือน (ข้อมูลเริ่มและสิ้นสุดกลางเดือน) เทียบกับเดือนเต็มโดยตรงไม่ได้ ให้ใช้ “เฉลี่ยต่อวัน” · engagement เทียบข้ามแพลตฟอร์มไม่ได้</p>
  <div class="grid g1">${card("cMo", "engagement" + (perday ? " (เฉลี่ยต่อวัน)" : "") + " · " + PL[pl] + " · " + (sc === "owned" ? "Owned" : "Earned"), "แยกตามเดือน 4 แบรนด์", true)}</div>
  <div class="card" style="margin-top:14px"><div class="tw"><table id="mT"></table></div></div>
  <h2>Brand Score รายเดือน · Zocial Eye</h2>
  <div class="controls"><div class="ctl">ตัวชี้วัด ${seg("mMet", MET.map(m => ({v:m, t:m})), st.metric)}</div></div>
  <p class="note warn">ช่วง <b>${so[0]} – ${so[last]}</b> <b>คนละช่วงกับข้อมูลโพสต์ด้านบน</b> จึงแสดงแยกกัน · ${esc(D.meta.score_note.replace(/^Note:\s*/, ""))} · คะแนนแต่ละตัวชี้วัดมีสเกลต่างกัน เทียบข้ามตัวชี้วัดไม่ได้</p>
  <div class="grid g1">${card("cMs", st.metric + " รายเดือน", "แยกตามเดือน 4 แบรนด์", true)}</div>
  <h2>${st.metric} รายเดือน</h2><div class="card"><div class="tw"><table id="mB"></table></div></div>
  <h2>เปลี่ยนแปลงจากเดือนก่อน · ${st.metric}</h2><div class="card"><div class="tw"><table id="mD"></table></div></div>
  <h2>ทุกตัวชี้วัด</h2><div class="card"><div class="tw"><table id="mS"></table></div></div>`;
  p.innerHTML = h; bindTables(p);
  bindSeg("mPlat", v => { st.plat = v; render(); }); bindSeg("mScope", v => { st.scope = v; render(); }); bindSeg("mMode", v => { st.mode = v; render(); }); bindSeg("mMet", v => { st.metric = v; render(); });
  // --- engagement by month
  mk("cMo", "bar", {labels:info.map(i => i.label), datasets:BK.map(b => ({label:bname(b), data:M.months.map((_, i) => ev(b, i)), backgroundColor:bcol(b),
      borderRadius:4, borderSkipped:false, borderColor:cv("--surface"), borderWidth:2, maxBarThickness:38}))},
    {plugins:{vl:{on:true, fmt:v => perday ? fmt1(v) : abbr(v)}}, scales:{y:{ticks:{callback:v => abbr(v)}}}}, efmt);
  const full = info.map((x, i) => x.full ? i : -1).filter(i => i >= 0), i0 = full[full.length - 2], i1 = full[full.length - 1], canDelta = full.length >= 2;
  let t = `<thead><tr><th>แบรนด์</th>${info.map(x => `<th>${x.label}</th>`).join("")}<th>${perday ? "เฉลี่ยต่อวันทั้งช่วง" : "รวมทั้งช่วง"}</th>${canDelta ? `<th>เปลี่ยนแปลง ${THM[info[i0].m - 1]}→${THM[info[i1].m - 1]} (เดือนเต็ม)</th>` : ""}</tr></thead><tbody>`;
  BK.forEach(b => { const s = M.eng[`${b}|${pl}|${sc}`];
    if (!s){ t += `<tr><td>${bdot(b)}${bname(b)}</td><td colspan="${info.length + 1 + (canDelta ? 1 : 0)}" class="na">${NA}</td></tr>`; return; }
    const vals = M.months.map((_, i) => ev(b, i)), tot = perday ? sum(s) / sum(M.days) : sum(s);
    const dcell = canDelta ? `<td>${vals[i0] > 0 ? (vals[i1] >= vals[i0] ? "+" : "") + fpct((vals[i1] - vals[i0]) / vals[i0] * 100) : NA}</td>` : "";
    t += `<tr><td>${bdot(b)}${bname(b)}</td>${vals.map(v => `<td>${efmt(v)}</td>`).join("")}<td>${efmt(tot)}</td>${dcell}</tr>`; });
  $("#mT").innerHTML = t + "</tbody>";
  // --- Brand Score by month
  mk("cMs", "bar", {labels:so, datasets:BK.map(b => ({label:bname(b), data:arr(b, st.metric), backgroundColor:bcol(b), borderRadius:4, borderSkipped:false,
      borderColor:cv("--surface"), borderWidth:2, maxBarThickness:26}))},
    {plugins:{vl:{on:true, fmt:v => fmt1(v)}}, scales:{y:{beginAtZero:st.metric !== "Sentiment Score", ticks:{callback:v => v}}}}, fmt1);
  const lv = BK.map(b => arr(b, st.metric)[last]);
  let u = `<thead><tr><th>แบรนด์</th>${so.map(m => `<th>${m}</th>`).join("")}<th>${so[0]}→${so[last]}</th><th>อันดับ ${so[last]}</th></tr></thead><tbody>`;
  BK.forEach((b, i) => { const a = arr(b, st.metric), d = a[last] - a[0];
    u += `<tr><td>${bdot(b)}${bname(b)}</td>${so.map((_, k) => a[k] == null ? `<td class="na">${NA}</td>` : `<td>${fmt1(a[k])}</td>`).join("")}<td>${d >= 0 ? "+" : ""}${fmt1(d)}</td><td>#${1 + lv.filter(x => x > lv[i]).length}</td></tr>`; });
  $("#mB").innerHTML = u + "</tbody>";
  let d = `<thead><tr><th>แบรนด์</th>${so.slice(1).map((m, k) => `<th>${so[k]}→${m}</th>`).join("")}</tr></thead><tbody>`;
  BK.forEach(b => { const a = arr(b, st.metric);
    d += `<tr><td>${bdot(b)}${bname(b)}</td>${so.slice(1).map((_, k) => { const x = a[k + 1] - a[k]; return isNaN(x) ? `<td class="na">${NA}</td>` : `<td>${x >= 0 ? "+" : ""}${fmt1(x)}</td>`; }).join("")}</tr>`; });
  $("#mD").innerHTML = d + "</tbody>";
  let q = `<thead><tr><th>ตัวชี้วัด</th><th>แบรนด์</th>${so.map(m => `<th>${m}</th>`).join("")}</tr></thead><tbody>`;
  MET.forEach(met => BK.forEach((b, bi) => { const a = arr(b, met);
    q += `<tr><td>${bi === 0 ? met : ""}</td><td>${bdot(b)}${bname(b)}</td>${so.map((_, i) => a[i] == null ? `<td class="na">${NA}</td>` : `<td>${fmt1(a[i])}</td>`).join("")}</tr>`; }));
  $("#mS").innerHTML = q + "</tbody>";
}

const RENDER = {overview:rOverview, score:rScore, platform:rPlatform, earned:rEarned, sentiment:rSent, monthly:rMonthly, trend:rTrend, top:rTop, quality:rQuality};
let active = "overview";
function render(){
  destroyAll();
  const p = document.getElementById("panel-" + active);
  RENDER[active](p);
}
function setTab(id, plat){
  active = id; safeSet("medcmu-tab", id);
  if (plat) S.platform.plat = plat;
  TABS.forEach(t => { const pn = document.getElementById("panel-" + t.id), on = t.id === id; pn.hidden = !on; if (!on) pn.innerHTML = ""; });
  const T = TABS.find(t => t.id === id); $("#pgTitle").textContent = id === "platform" ? "แพลตฟอร์ม (Owned) · " + PL[S.platform.plat] : T.t; $("#pgSub").textContent = T.d;
  document.querySelectorAll(".nav-item").forEach(b => { const on = b.dataset.id === id && (id !== "platform" || b.dataset.plat === S.platform.plat); on ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"); });
  history.replaceState(null, "", "#" + id);
  render();
}
function init(){
  $("#brandChips").innerHTML = BR.map(b => `<span class="chip" title="${esc(b.label)}"><i style="background:var(--b-${b.key})"></i>${esc(b.short)}</span>`).join("");
  $("#sideFoot").innerHTML = `<b>ฐานข้อมูล Wisesight ZocialEye</b>โพสต์ ${dlabel(D.meta.export_period[0])} – ${dlabel(D.meta.export_period[1])} 2026<br>Brand Score ${D.meta.score_period[0]} – ${D.meta.score_period[1]}`;
  $("#foot").textContent = `ที่มา: ${D.meta.source_export} · ${D.meta.source_score} · ตัวเลขทุกค่าคำนวณจากสองไฟล์นี้ด้วย build_dashboard.py (ledger: metrics_ledger.csv)`;
  const nav = $("#nav"), pan = $("#panels");
  NAV.forEach(g => {
    const grp = document.createElement("div"); grp.className = "nav-group"; grp.innerHTML = `<div class="nav-h">${esc(g.h)}</div>`;
    g.items.forEach(it => {
      const T = TABS.find(t => t.id === it.id), b = document.createElement("button"); b.type = "button"; b.className = "nav-item"; b.dataset.id = it.id; if (it.plat) b.dataset.plat = it.plat;
      b.innerHTML = (it.mono ? `<span class="mono">${it.mono}</span>` : ICON[it.i]) + `<span class="lbl">${esc(it.label || T.t)}</span>` + (it.badge != null ? `<span class="badge" title="${esc(it.tip)}">${fmt(it.badge)}</span>` : "");
      b.onclick = () => setTab(it.id, it.plat); grp.appendChild(b);
    });
    nav.appendChild(grp);
  });
  TABS.forEach(t => { const s = document.createElement("section"); s.className = "panel"; s.id = "panel-" + t.id; s.hidden = true; pan.appendChild(s); });
  const th = safeGet("medcmu-theme"); document.documentElement.dataset.theme = th === "light" ? "light" : "dark";
  $("#themeBtn").onclick = () => { const nx = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; safeSet("medcmu-theme", nx); render(); };
  const h = location.hash.replace("#", ""), st = safeGet("medcmu-tab");
  setTab(TABS.some(t => t.id === h) ? h : TABS.some(t => t.id === st) ? st : "overview");
}
init();
</script>
</body>
