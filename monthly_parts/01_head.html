<html lang="th">
<head>

<title>MEDCMU Social Monthly</title>
<meta name="theme-color" content="#070b16">
<script>try{var __t=localStorage.getItem("medcmu-theme");document.documentElement.dataset.theme=__t==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%237c3aed%27/%3E%3Cstop offset=%271%27 stop-color=%27%23c026d3%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 22V10l9 8 9-8v12%27 stroke=%27white%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== MEDCMU Social Dashboard · visual system (executive glass, 2026-10-29) =====
   Dark glass cards on a soft violet/fuchsia glow. The four --b-* brand colours are DATA semantics
   (one per brand across every chart/table) — never reuse them for UI chrome; chrome uses violet/fuchsia only. */
:root{
  color-scheme:light;
  --page:#eef1f8; --surface:#ffffff; --surface-2:#f2f3fa; --border:rgba(15,23,42,.10); --grid:rgba(15,23,42,.07);
  --glass:rgba(255,255,255,.74);
  --text-1:#0f172a; --text-2:#475569; --text-3:#5b6678;
  --b-MEDCMU:#2a78d6; --b-SI:#eb6834; --b-CU:#1baf7a; --b-SMV:#eda100;
  --pos:#2a78d6; --neu:#b9b8b2; --neg:#e34948;
  --side:#ffffff; --accent:#6d28d9; --accent-solid:#7c3aed; --accent-2:#c026d3;
  --grad:linear-gradient(100deg,#6d28d9 0%,#a21caf 55%,#db2777 100%);
  --orb1:#a78bfa; --orb2:#f0abfc; --orb3:#818cf8;
  --warn-bg:#fdf3dc; --warn-text:#6b4a00;
  --shadow:0 10px 40px -18px rgba(15,23,42,.25);
  --bar:rgba(238,241,248,.80);
  --r:18px; --r-sm:10px;
  --fz:15px;
}
/* dark tokens: set on <html data-theme="dark"> by the inline script in <head> (default) and by the toggle */
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#070b16; --side:#0b1222; --surface:#0f1627; --surface-2:#161e33; --border:rgba(255,255,255,.09); --grid:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.045);
  --text-1:#e9edf6; --text-2:#a3afc6; --text-3:#8b98b3;
  --b-MEDCMU:#3987e5; --b-SI:#d95926; --b-CU:#199e70; --b-SMV:#c98500;
  --pos:#3987e5; --neu:#6b6a65; --neg:#e66767;
  --accent:#c4b5fd; --accent-solid:#7c3aed; --accent-2:#e879f9;
  --grad:linear-gradient(100deg,#a78bfa 0%,#e879f9 55%,#f9a8d4 100%);
  --orb1:#7c3aed; --orb2:#c026d3; --orb3:#4338ca;
  --warn-bg:#2b2410; --warn-text:#f1d58a;
  --shadow:0 20px 60px -25px rgba(0,0,0,.8); --bar:rgba(7,11,22,.72);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--page);color:var(--text-1);
  font-family:"Prompt","Noto Sans Thai","Sukhumvit Set","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fz);line-height:1.55;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.seg button:focus-visible{outline-offset:-2px;border-radius:0}
button,select,input,a{transition:background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease,filter .15s ease}
button{cursor:pointer}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent-solid);color:#fff;padding:8px 14px;border-radius:var(--r-sm);text-decoration:none;font-weight:600}
.skip:focus{top:12px}

/* ---- controls ---- */
.sub{color:var(--text-2);font-size:13px;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.3;color:var(--text-2);
  background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 11px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chipl{font-size:12px;color:var(--text-3);font-weight:500;margin-right:2px;white-space:nowrap}
button.chip{font:inherit;font-size:13px;line-height:1.3}
button.chip.pick{opacity:.7}
button.chip.pick.on{opacity:1;color:var(--text-1);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
button.chip.pick:hover{opacity:1;border-color:var(--text-3)}
.chip.fixed{color:var(--text-1);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));font-weight:600}
.btn{font:inherit;font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:5px 10px}
.btn:hover{border-color:var(--text-3)}
section.panel{padding-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:0 0 14px}
.ctl{display:flex;align-items:center;flex-wrap:wrap;max-width:100%;gap:8px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.seg{max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;display:inline-flex;border:1px solid var(--border);border-radius:999px;background:var(--glass)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;font:inherit;font-size:13px;color:var(--text-2);background:transparent;border:0;padding:6px 12px;
  border-right:1px solid var(--border);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover:not(.on){background:var(--surface-2);color:var(--text-1)}
.seg button.on{background:var(--grad);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button.on{color:#1a0b2e}
select{font:inherit;font-size:13px;color:var(--text-1);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:6px 8px;max-width:100%}
select:hover{border-color:var(--text-3)}
label.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 11px}
label.tog:hover{border-color:var(--text-3)}
label.tog input{accent-color:var(--accent-solid)}
label.tog i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---- layout ---- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g1{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g4{grid-template-columns:minmax(0,1fr)}.g4:has(.kpi2){grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- cards ---- */
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin:0;box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s}
.card:hover{border-color:color-mix(in srgb,var(--accent-solid) 40%,transparent)}
.kpi2:hover,.kpi:hover{transform:translateY(-3px)}
.card h3{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.1px}
.card .sub{margin:3px 0 10px}
.card figcaption{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tbtn{font:inherit;font-size:12px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid var(--border);
  border-radius:6px;padding:3px 10px;white-space:nowrap}
.tbtn:hover{border-color:var(--text-3);color:var(--text-1)}
.tbtn[aria-expanded="true"]{background:var(--surface-2);color:var(--text-1)}
.cv{position:relative;height:300px}
.cv.tall{height:360px}
.kpi{position:relative;overflow:hidden;padding-top:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--kc) 16%,transparent),transparent 55%),var(--glass)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--kc)}
.kpi .name{font-size:13px;color:var(--text-2);font-weight:600;line-height:1.35}
.kpi .big{font-size:28px;font-weight:700;line-height:1.15;margin:6px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px;color:var(--text-2)}
.kpi dd{margin:0;text-align:right;color:var(--text-1);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--text-2);background:var(--glass);border:1px solid var(--border);border-left:3px solid var(--accent-solid);
  border-radius:var(--r-sm);padding:9px 13px;margin:0 0 14px}
.note.warn{background:var(--warn-bg);color:var(--warn-text);border-color:transparent;border-left:3px solid currentColor}
.note b{color:inherit}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
th{color:var(--text-2);font-weight:600;font-size:12px;background:var(--surface-2);position:sticky;top:0;letter-spacing:.2px}
.card th{background:color-mix(in srgb,var(--surface-2) 80%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.na{color:var(--text-3);font-size:12px}
td.best{font-weight:700}
.bdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline;background:var(--kc)}
.tv{margin-top:8px}
.tv[hidden]{display:none}
a{color:var(--accent)}
.ptxt{max-width:520px;white-space:normal;text-align:left}
h2{font-size:16px;font-weight:600;margin:28px 0 12px;letter-spacing:.1px}
h2::before{content:"";display:inline-block;width:4px;height:1em;background:var(--grad);border-radius:3px;margin-right:10px;vertical-align:-2px}
ul.clean{margin:6px 0 0;padding-left:18px;color:var(--text-2);font-size:13.5px}
ul.clean li{margin:4px 0}
footer{color:var(--text-3);font-size:12px;margin-top:30px;padding-top:14px;border-top:1px solid var(--border)}

/* ---- shell: top bar + tab strip (2026-10-29 redesign) ---- */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;animation:float 22s ease-in-out infinite}
:root[data-theme="dark"] .orb{opacity:.30}
.o1{width:520px;height:520px;background:var(--orb1);top:-200px;left:-140px}
.o2{width:460px;height:460px;background:var(--orb2);top:22%;right:-180px;animation-delay:-7s}
.o3{width:380px;height:380px;background:var(--orb3);bottom:-180px;left:35%;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.08)}66%{transform:translate(-40px,30px) scale(.94)}}
.grid-ov{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
.app{position:relative;z-index:1;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--border)}
.tb-row{display:flex;align-items:center;gap:12px 18px;padding:12px 32px 8px;max-width:1680px;margin:0 auto}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-mark{flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#c026d3);display:grid;place-items:center;
  box-shadow:0 8px 24px -8px rgba(192,38,211,.6)}
.logo-mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.logo-t{font-size:18px;font-weight:700;letter-spacing:.1px;line-height:1.15}
.logo-s{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 32px 10px;max-width:1680px;margin:0 auto}
#nav::-webkit-scrollbar{display:none}
.nav-group{display:contents}.nav-h{display:none}
.nav-item{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font:inherit;font-size:13.5px;font-weight:500;color:var(--text-2);
  background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:7px 14px}
.nav-item:hover{color:var(--text-1);border-color:color-mix(in srgb,var(--accent-solid) 45%,transparent)}
.nav-item[aria-current="page"]{color:#fff;font-weight:600;background:var(--grad);border-color:transparent;box-shadow:0 8px 22px -10px rgba(168,85,247,.8)}
:root[data-theme="dark"] .nav-item[aria-current="page"]{color:#1a0b2e}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item .mono{width:16px;height:16px;flex:0 0 16px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);
  font-size:9px;font-weight:700;display:grid;place-items:center;color:var(--text-2)}
.nav-item .badge{font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0 8px}
.side-foot{font-size:12px;color:var(--text-3);line-height:1.55;margin-top:6px}
.side-foot b{color:var(--text-2);font-weight:600;margin-right:6px}
.main{min-width:0;padding:0 32px 52px;max-width:1680px;margin:0 auto}
header.top{padding:26px 0 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);background:var(--glass);border:1px solid var(--border);
  border-radius:999px;padding:4px 12px 4px 8px;margin-bottom:12px}
.eyebrow .live{width:8px;height:8px;border-radius:50%;background:#a78bfa;box-shadow:0 0 0 4px color-mix(in srgb,#a78bfa 25%,transparent)}
h1{font-size:40px;margin:0;font-weight:800;letter-spacing:-.5px;line-height:1.2;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-bottom:2px}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){h1{color:var(--accent)}}
header.top .sub{font-size:15px;margin-top:8px}
.hright{display:flex;gap:8px;align-items:center;margin-left:auto;flex:0 0 auto}
.period{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-2);background:var(--glass);
  border:1px solid var(--border);border-radius:999px;padding:6px 12px;white-space:nowrap}
.period::before{content:"";width:7px;height:7px;border-radius:50%;background:#a78bfa}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;color:var(--text-2);background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:0}
.iconbtn:hover{color:var(--text-1);border-color:color-mix(in srgb,var(--accent-solid) 45%,transparent)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbtn2{display:inline-flex;align-items:center;gap:7px;height:38px;font:inherit;font-size:13px;font-weight:600;color:#fff;border:0;border-radius:12px;padding:0 14px;
  background:linear-gradient(135deg,#7c3aed,#c026d3);box-shadow:0 8px 24px -10px rgba(192,38,211,.8)}
.tbtn2 svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn2:hover{filter:brightness(1.08)}
.filterbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:0 0 20px;padding:12px 16px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.btn.primary{color:#fff;border:0;background:var(--accent-solid);padding:8px 14px;border-radius:var(--r-sm);font-weight:600}
.kpi2{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px 20px 14px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--kc) 14%,transparent),transparent 60%),var(--glass)}
.kpi2 .ico{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--kc);
  background:color-mix(in srgb,var(--kc) 16%,transparent);border:1px solid color-mix(in srgb,var(--kc) 30%,transparent)}
.kpi2 .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi2 .kl{font-size:13px;font-weight:500;color:var(--text-2);padding-right:44px}
.kpi2 .kv{font-size:32px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.4px;margin-top:4px}
.kpi2 .kcap{font-size:12px;color:var(--text-3);margin-top:3px;line-height:1.4}
.spk{position:relative;height:54px;margin-top:10px}
.spk-cap{font-size:11px;color:var(--text-3);margin-top:4px}
.hnote{font-size:12.5px;color:var(--text-3);margin:10px 2px 18px}

/* ---- overview additions: insights, heatmap, ranking ---- */
.g21{display:grid;gap:14px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.g21{grid-template-columns:minmax(0,1fr)}}
.ins h3{display:flex;align-items:center;gap:8px}
.ins h3 svg{width:18px;height:18px;stroke:#c084fc;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ins ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--text-2);background:color-mix(in srgb,var(--surface-2) 55%,transparent);
  border:1px solid var(--border);border-radius:14px;padding:11px 13px}
.ins li b{color:var(--text-1);font-weight:600}
.ins li .ii{flex:0 0 30px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,#a78bfa 18%,transparent);color:#a78bfa}
.ins li.warn .ii{background:color-mix(in srgb,#fbbf24 18%,transparent);color:#d97706}
.ins li .ii svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
table.hm{border-collapse:separate;border-spacing:4px;font-size:13px}
table.hm th{background:transparent;position:static;text-align:center}
table.hm th:first-child{text-align:left}
table.hm td{text-align:center;border:0;border-radius:9px;padding:9px 10px;font-weight:600;color:var(--text-1)}
table.hm td:first-child{text-align:left;font-weight:500;background:transparent;white-space:nowrap}
table.hm td.na{font-weight:400;color:var(--text-3);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--text-3) 10%,transparent) 6px 7px);
  border:1px dashed var(--border)}
table.hm tbody tr:hover td{background:revert-layer}
.rk td .rbar{display:inline-block;vertical-align:middle;height:6px;border-radius:3px;background:var(--grad);margin-right:8px}
.rk td.rank{color:var(--text-3);width:28px}
.rk-h{display:flex;align-items:center;gap:8px}

/* ---- presentation mode (wall display) ---- */
body.present{--fz:17px}
body.present #nav,body.present .skip{display:none}
body.present .main{max-width:none;padding:0 44px 56px}
body.present .tb-row{max-width:none;padding-inline:44px}
body.present h1{font-size:46px}
body.present .kpi2 .kv{font-size:44px}body.present .kpi .big{font-size:38px}
body.present .card h3{font-size:18px}body.present table{font-size:15px}
body.present .cv{height:380px}body.present .cv.tall{height:460px}

/* ---- touch targets ---- */
@media (pointer:coarse){
  .nav-item,.seg button,.tbtn,.btn,select,button.chip,label.tog,.iconbtn,.tbtn2{min-height:44px}
  .iconbtn{min-width:44px}
  .seg button{padding-inline:14px}
}
@media (max-width:900px){
  .tb-row{padding:10px 14px 6px}
  #nav{padding:2px 14px 9px}
  .logo-mark{flex-basis:34px;width:34px;height:34px;border-radius:10px}.logo-t{font-size:16px}.logo-s{display:none}
  .tbtn2 span{display:none}.tbtn2{padding:0 11px}
  .main{padding:0 14px 40px}
  header.top{padding:18px 0 12px}
  h1{font-size:28px}
  .filterbar{flex-wrap:nowrap;padding:9px 12px}
  .filterbar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;padding-bottom:1px}
  .filterbar .chips::-webkit-scrollbar{display:none}
  .chips>*{flex:0 0 auto}
  .cv{height:260px}.cv.tall{height:300px}
  .card{padding:14px}
  .kpi2{padding:14px}.kpi2 .kv{font-size:24px}.kpi2 .ico{display:none}.kpi2 .kl{padding-right:0}
  .period{display:none}
}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

/* ---- monthly additions ---- */
.sb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.5;border-radius:999px;padding:1px 10px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);white-space:nowrap}
.sb::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}
.sb.partial::before{background:transparent;border:2px solid currentColor}
.sb.nodata{border-style:dashed;color:var(--text-3)}
.sb.nodata::before{display:none}
.msrc{color:var(--text-3)}
.dl{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-1)}
.dl.na{color:var(--text-3);font-weight:500}
.kcap .dl{font-size:12px}
.kpi dd .dl{font-size:12.5px}
.seg{position:relative}

/* ---- print / save as PDF ---- */
@media print{
  .topbar,.bg-fx,.filterbar,.iconbtn,.tbtn2,.controls,.tbtn,.skip,.hright{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  .card,.filterbar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#fff!important}
  h1{color:#111!important;background:none!important}
  body{background:#fff;font-size:12px}
  .card,.note{box-shadow:none;break-inside:avoid}
  /* canvases are sized for the screen layout: scale them to the page instead of letting them overflow */
  .cv,.cv.tall{height:auto!important}
  .cv canvas{max-width:100%!important;height:auto!important}
  header.top{padding-top:0}
  a{color:inherit;text-decoration:none}
}
</style>

<body>
<div class="bg-fx" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid-ov"></div></div>
<a class="skip" href="#panels">ข้ามไปยังเนื้อหา</a>
<div class="app">
  <header class="topbar">
    <div class="tb-row">
      <div class="logo"><div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17V8l7 6 7-6v9"/></svg></div>
        <div style="min-width:0"><div class="logo-t">MedCMU Social Insight</div><div class="logo-s">Monthly social · 4-brand benchmark · Brand Scan (Zocial Eye)</div></div></div>
      <div class="hright">
        <span class="period" id="periodBadge"></span>
        <button class="iconbtn" id="printBtn" type="button" aria-label="พิมพ์ / บันทึก PDF" title="พิมพ์ / บันทึก PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
        <button class="iconbtn" id="themeBtn" type="button" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="tbtn2" id="presentBtn" type="button" aria-pressed="false" aria-label="โหมดนำเสนอเต็มจอ" title="โหมดนำเสนอเต็มจอ (ลูกศรซ้าย/ขวาเปลี่ยนหน้า · Esc ออก)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg><span>นำเสนอ</span></button>
      </div>
    </div>
    <nav id="nav" aria-label="เมนูหลัก"></nav>
  </header>
  <main class="main">
    <header class="top">
      <div><div class="eyebrow"><span class="live"></span><span id="heroDate"></span></div><h1 id="pgTitle"></h1><p class="sub" id="pgSub"></p></div>
    </header>
    <div class="filterbar" role="region" aria-label="ตัวกรองแบรนด์">
      <div class="chips" id="brandChips" aria-label="สีประจำแบรนด์"></div>
    </div>
    <div id="panels"></div>
    <footer id="foot"></footer>
    <div class="side-foot" id="sideFoot"></div>
  </main>
</div>

<script>/*__CHARTJS__*/</script>
<script>
const D = /*__DATA__*/null;
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const PL = {facebook:"Facebook", instagram:"Instagram", tiktok:"TikTok", youtube:"YouTube", twitter:"X / Twitter"};
const SC = {owned:"Owned (บัญชีทางการ)", earned:"Earned (ถูกกล่าวถึง)"};
const BR = D.brands, ALL = BR.map(b => b.key);
/* brand filter: MEDCMU is always shown; other brands are opt-in (default = MEDCMU only), remembered in localStorage */
let EXTRA = new Set();
try { (JSON.parse(safeGet("medcmu-brands") || "[]") || []).forEach(k => { if (ALL.includes(k) && k !== "MEDCMU") EXTRA.add(k); }); } catch(e){}
let BK = ALL.filter(k => k === "MEDCMU" || EXTRA.has(k));
function setExtra(set){ EXTRA = set; BK = ALL.filter(k => k === "MEDCMU" || EXTRA.has(k)); safeSet("medcmu-brands", JSON.stringify([...EXTRA])); }
const bname = k => BR.find(b => b.key === k).short;
const cell = (b, p, s) => D.cells[`${b}|${p}|${s}`] || null;
const NA = "ข้อมูลไม่เพียงพอ";
const nf = new Intl.NumberFormat("th-TH");
const fmt = v => v == null ? NA : nf.format(Math.round(v));
const fmt1 = v => v == null ? NA : new Intl.NumberFormat("th-TH", {maximumFractionDigits:1}).format(v);
const fpct = (v, d = 1) => v == null ? NA : new Intl.NumberFormat("th-TH", {maximumFractionDigits:d, minimumFractionDigits:d}).format(v) + "%";
const abbr = v => { const a = Math.abs(v); return a >= 1e6 ? (v/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,"")+"M" : a >= 1e3 ? (v/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,"")+"k" : String(Math.round(v)); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const bcol = k => cv("--b-" + k);
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const dlabel = d => new Date(d + "T00:00:00Z").toLocaleDateString("th-TH", {day:"numeric", month:"short", timeZone:"UTC"});
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

function seg(id, opts, val){
  return `<div class="seg" id="${id}" role="group">${opts.map(o => `<button type="button" data-v="${esc(o.v)}" class="${o.v === val ? "on" : ""}" aria-pressed="${o.v === val}">${esc(o.t)}</button>`).join("")}</div>`;
}
function bindSeg(id, cb){ const h = $("#" + id); h && h.querySelectorAll("button").forEach(b => b.onclick = () => cb(b.dataset.v)); }
function sel(id, opts, val){
  return `<select id="${id}">${opts.map(o => `<option value="${esc(o.v)}" ${o.v === val ? "selected" : ""}>${esc(o.t)}</option>`).join("")}</select>`;
}
function bindSel(id, cb){ const h = $("#" + id); h && (h.onchange = () => cb(h.value)); }
const platOpts = (all) => (all ? [{v:"all", t:"ทุกแพลตฟอร์ม"}] : []).concat(D.platforms.map(p => ({v:p, t:PL[p]})));

/* ---------- charts ---------- */
const charts = {}, tableOpen = new Set();
function deepMerge(a, b){ for (const k in b){ if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) { a[k] = deepMerge(a[k] && typeof a[k] === "object" ? a[k] : {}, b[k]); } else a[k] = b[k]; } return a; }

const valueLabels = {
  id:"vl",
  afterDatasetsDraw(chart){
    const o = chart.options.plugins.vl; if (!o || !o.on) return;
    const ctx = chart.ctx, horiz = chart.options.indexAxis === "y";
    ctx.save(); ctx.font = "600 11.5px " + getComputedStyle(document.body).fontFamily; ctx.fillStyle = cv("--text-1");
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di); if (meta.hidden) return;
      meta.data.forEach((el, i) => {
        const v = ds.data[i];
        if (v == null){
          ctx.fillStyle = cv("--text-3"); ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "center"; ctx.textBaseline = "bottom";
          const x = el.x, y = (chart.scales.y ? chart.scales.y.getPixelForValue(0) : el.y) - 4;
          if (!horiz) ctx.fillText(NA, x, y);
          ctx.fillStyle = cv("--text-1"); ctx.font = "600 11.5px " + getComputedStyle(document.body).fontFamily;
          return;
        }
        const t = chart.$vlfmt ? chart.$vlfmt(v) : String(v);
        if (horiz){ ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(t, el.x + 6, el.y); }
        else { ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.fillText(t, el.x, el.y - 4); }
      });
    });
    ctx.restore();
  }
};
const crosshair = {
  id:"cross",
  afterDatasetsDraw(chart){
    if (chart.config.type !== "line") return;
    const a = chart.tooltip && chart.tooltip._active; if (!a || !a.length) return;
    const x = a[0].element.x, ca = chart.chartArea, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = cv("--text-3"); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, ca.top); ctx.lineTo(x, ca.bottom); ctx.stroke(); ctx.restore();
  }
};
const endLabels = {
  id:"endl",
  afterDatasetsDraw(chart){
    if (!chart.options.plugins.endl || !chart.options.plugins.endl.on) return;
    const ctx = chart.ctx, pts = [];
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di); if (meta.hidden) return;
      let li = -1; for (let i = ds.data.length - 1; i >= 0; i--) if (ds.data[i] != null){ li = i; break; }
      if (li >= 0) pts.push({y:meta.data[li].y, x:meta.data[li].x, t:ds.label});
    });
    pts.sort((a, b) => a.y - b.y);
    for (let i = 1; i < pts.length; i++) if (pts[i].y - pts[i-1].y < 14) pts[i].y = pts[i-1].y + 14;
    ctx.save(); ctx.font = "600 12px " + getComputedStyle(document.body).fontFamily; ctx.fillStyle = cv("--text-1");
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    pts.forEach(p => ctx.fillText(p.t, p.x + 9, p.y));
    ctx.restore();
  }
};

function baseOpts(type){
  const grid = cv("--grid"), t2 = cv("--text-2");
  const o = {
    responsive:true, maintainAspectRatio:false, animation:false,
    layout:{padding:{top:18, right:4}},
    plugins:{
      legend:{position:"bottom", labels:{color:t2, usePointStyle:true, pointStyle:"rectRounded", boxWidth:9, boxHeight:9, font:{size:12}}},
      tooltip:{backgroundColor:cv("--surface-2"), titleColor:cv("--text-1"), bodyColor:cv("--text-1"), borderColor:cv("--border"), borderWidth:1,
               padding:10, boxPadding:4, usePointStyle:true, cornerRadius:8, titleFont:{weight:"600"},
               callbacks:{label: c => ` ${c.dataset.label ? c.dataset.label + ": " : ""}${c.parsed.y == null && c.parsed.x != null ? fmt(c.parsed.x) : (c.parsed.y == null ? NA : fmt1(c.parsed.y))}`}},
      vl:{on:false}, endl:{on:false}
    },
    scales:{
      x:{grid:{display:false}, border:{color:grid}, ticks:{color:t2, font:{size:12}, maxRotation:0, autoSkip:true}},
      y:{beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{color:t2, font:{size:12}, callback:v => abbr(v)}}
    },
    interaction:{mode:"nearest", intersect:true}
  };
  if (type === "line") o.interaction = {mode:"index", intersect:false};
  return o;
}
function mk(id, type, data, opts = {}, tfmt){
  if (charts[id]) charts[id].destroy();
  const el = document.getElementById(id); if (!el) return;
  // Chart.js treats any function-valued option as scriptable (calls it with a context object),
  // so keep the value-label formatter out of the options tree.
  const vlfmt = opts.plugins && opts.plugins.vl ? opts.plugins.vl.fmt : null;
  if (vlfmt) delete opts.plugins.vl.fmt;
  const cfg = {type, data, options:deepMerge(baseOpts(type), opts), plugins:[valueLabels, crosshair, endLabels]};
  const ch = new Chart(el, cfg); ch.$tfmt = tfmt || fmt1; ch.$vlfmt = vlfmt; charts[id] = ch;
  ch.update("none"); // the constructor's first draw ran before $vlfmt was set (value labels fell back to raw numbers)
  fillTable(id);
  return ch;
}
function destroyAll(){ Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function fillTable(id){
  const host = document.getElementById(id + "-t"); if (!host) return;
  const ch = charts[id], labels = ch.data.labels, ds = ch.data.datasets;
  let h = `<div class="tw"><table><thead><tr><th></th>${ds.map(d => `<th>${esc(d.label || "ค่า")}</th>`).join("")}</tr></thead><tbody>`;
  labels.forEach((l, i) => { h += `<tr><td>${esc([].concat(l).join(" · "))}</td>${ds.map(d => { const v = d.data[i]; return v == null ? `<td class="na">${NA}</td>` : `<td>${ch.$tfmt(v)}</td>`; }).join("")}</tr>`; });
  host.innerHTML = h + "</tbody></table></div>";
  host.hidden = !tableOpen.has(id);
}
function card(id, title, sub, tall){
  return `<figure class="card"><figcaption><div><h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}</div>
  <button class="tbtn" type="button" data-t="${id}" aria-expanded="${tableOpen.has(id)}">ตาราง</button></figcaption>
  <div class="cv ${tall ? "tall" : ""}"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div><div class="tv" id="${id}-t" hidden></div></figure>`;
}
function bindTables(root){
  root.querySelectorAll(".tbtn").forEach(b => b.onclick = () => {
    const id = b.dataset.t, h = document.getElementById(id + "-t");
    if (tableOpen.has(id)) tableOpen.delete(id); else tableOpen.add(id);
    h.hidden = !tableOpen.has(id); b.setAttribute("aria-expanded", tableOpen.has(id));
  });
}
const barDs = (vals, extra = {}) => Object.assign({data:vals, backgroundColor:BK.map(bcol), borderRadius:4, borderSkipped:false, maxBarThickness:56}, extra);
const bdot = k => `<span class="bdot" style="--kc:${bcol(k)}"></span>`;
